<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Laundry Room - POS</title>
<style>
*{box-sizing:border-box}body{font-family:Arial,Helvetica,sans-serif;margin:0;background:#f4f8f7;color:#111}
:root{--green:#1FA68F;--dark:#0F6B5C;--silver:#C0C0C0}
#login{position:fixed;inset:0;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;z-index:99}
.box{text-align:center;width:400px}.barbox{background:#fff;color:#000;padding:14px;font-size:34px;letter-spacing:16px;font-weight:900;border:4px solid var(--silver);border-radius:10px}
.bar{height:10px;background:#0f6b5c;margin:10px 0;border:3px solid var(--silver);border-radius:6px}.fill{height:100%;width:0%;background:#ffd700}
.pad{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:10px}
.pad button{background:var(--dark);color:#fff;border:4px solid #fff;height:82px;font-size:30px;font-weight:900;cursor:pointer;border-radius:10px}
.top{background:var(--green);color:#fff;padding:8px 18px;border-bottom:6px solid var(--silver);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.topLeft{display:flex;align-items:center;gap:14px}
.topRight{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.brandName{font-family:Georgia,serif;font-weight:900;font-size:34px;letter-spacing:3px;line-height:1;text-shadow:2px 2px 0 var(--dark);margin:0}
.brandSub{font-weight:900;letter-spacing:6px;font-size:14px;color:#fff}
.clock{font-weight:900;text-align:right;font-size:17px;line-height:1.4;white-space:nowrap}
.flag{font-size:44px;line-height:1;text-align:center}
.flag small{display:block;font-size:11px;font-weight:900;letter-spacing:2px;color:#fff}
.lockBtn{width:auto;margin:0;padding:10px 10px;font-size:14px;background:var(--dark);color:#fff;border:3px solid #fff;border-radius:10px;cursor:pointer;white-space:nowrap}
.dayBtn{width:auto;margin:0;padding:10px 10px;font-size:14px;background:#111;color:#fff;border:3px solid #fff;border-radius:10px;cursor:pointer;white-space:nowrap}
.drawerBtn{width:auto;margin:0;padding:10px 10px;font-size:14px;background:#0F6B5C;color:#fff;border:3px solid #ffd700;border-radius:10px;cursor:pointer;white-space:nowrap}
.logoLogin{width:190px;height:190px;border-radius:50%;object-fit:cover;border:6px solid var(--silver);background:#fff}
.logoTop{width:96px;height:96px;border-radius:50%;object-fit:cover;border:4px solid var(--silver);background:#fff;flex-shrink:0}
.logoReceipt{width:90px;height:90px;border-radius:50%;object-fit:cover;border:4px solid var(--silver)}
.wrap{display:flex;gap:10px;padding:4px 16px 16px;max-width:1200px;margin:0 auto}
.left{flex:1.9}.right{flex:1;min-width:340px}
.card{background:#fff;padding:18px;border-radius:14px;border:4px solid var(--dark);height:fit-content;position:sticky;top:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border:4px solid var(--silver);padding:26px 8px;color:#fff;font-weight:900;font-size:19px;cursor:pointer;min-height:130px;border-radius:12px;background:var(--green)}
.tile small{display:block;font-weight:800;font-size:14px;margin-top:6px}
.bigBtn{border:4px solid var(--silver);padding:10px 8px 26px;color:#fff;font-weight:900;font-size:26px;cursor:pointer;min-height:150px;border-radius:12px;background:var(--green);overflow:hidden}
.cardImg{width:100%;height:150px;object-fit:cover;border-radius:8px;border:3px solid #fff;display:block;margin-bottom:12px}
.totalRow{display:flex;justify-content:space-between;font-size:20px;font-weight:900;margin:8px 0}
.promoRow{display:flex;justify-content:space-between;color:var(--dark);font-weight:900;background:#e6f5f1;padding:8px;border:3px solid var(--green);border-radius:8px}
button{border:3px solid var(--dark);padding:13px;font-weight:900;width:100%;margin-top:7px;font-size:16px;cursor:pointer;border-radius:10px}
.charge{background:var(--green);color:#fff;font-size:20px;padding:17px;border-color:var(--silver)}
.holdBtn{background:#dff0ec;color:var(--dark)}
select{width:100%;padding:12px;font-size:16px;border:3px solid var(--dark);margin-top:7px;border-radius:8px;font-weight:700}
#receipt{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:98}
.paper{background:#fff;width:380px;max-height:92vh;overflow:auto;padding:18px;text-align:center;font-family:monospace;border:4px solid var(--silver);border-radius:10px}
.row{display:flex;justify-content:space-between;text-align:left}
.saleRow{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:8px 0;border-bottom:3px solid #ddd;font-size:15px}
.saleRow button{width:auto;padding:6px 10px;margin:0;font-size:15px}
h2{color:var(--dark);margin:4px 0;font-weight:900;letter-spacing:1px}
#mgmt{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:98}
#mgmt input{width:100%;padding:12px;font-size:16px;border:3px solid var(--dark);margin-top:7px;border-radius:8px;font-weight:700}
#dayend{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:98}
#drawerBox{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:98}
.designer{font-weight:900;font-size:12px;text-align:center;color:#0F6B5C;margin-top:10px}
@media(max-width:800px){.wrap{flex-direction:column}.grid{grid-template-columns:1fr 1fr}.card{position:static}.brandName{font-size:24px}.clock{font-size:13px}.logoTop{width:72px;height:72px}.flag{font-size:34px}.lockBtn,.dayBtn,.drawerBtn{font-size:12px;padding:8px 7px}.cardImg{height:110px}}
</style></head>
<body>
<div id="login"><div class="box"><img src="logo.png" class="logoLogin" alt="The Laundry Room"><p class="brandName">THE LAUNDRY ROOM</p><p class="brandSub">CLEAN • FRESH • CARE</p><p id="loginClock" style="font-weight:900"></p>
<div class="barbox" id="barbox">_ _ _ _</div><div class="bar"><div class="fill" id="fill"></div></div><div id="count">Staff only - Type PIN</div>
<div class="pad"><button onclick="press(1)">1</button><button onclick="press(2)">2</button><button onclick="press(3)">3</button><button onclick="press(4)">4</button><button onclick="press(5)">5</button><button onclick="press(6)">6</button><button onclick="press(7)">7</button><button onclick="press(8)">8</button><button onclick="press(9)">9</button><button onclick="pin='';draw()">C</button><button onclick="press(0)">0</button><button onclick="pin=pin.slice(0,-1);draw()">⌫</button></div></div></div>
<div class="top"><div class="topLeft"><img src="logo.png" class="logoTop" alt="Logo"><div><p class="brandName">THE LAUNDRY ROOM</p><p class="brandSub" style="margin:0">CLEAN • FRESH • CARE</p></div></div><div class="topRight"><div class="flag">🇿🇦<small>SA</small></div><button class="lockBtn" onclick="openMgmt()">🔒 MANAGEMENT</button><button class="drawerBtn" onclick="openDrawer()">💵 CASH DRAWER</button><button class="dayBtn" onclick="openDayEnd()">🧾 DAY END</button><div class="clock" id="topClock"></div></div></div>
<div class="wrap"><div class="left" id="left"></div><div class="right" id="right"></div></div>
<div id="receipt"><div class="paper" id="paper"></div></div>
<div id="mgmt"><div class="paper" id="mgmtPaper" style="text-align:left;font-family:Arial"></div></div>
<div id="dayend"><div class="paper" id="dayPaper" style="text-align:left;font-family:Arial"></div></div>
<div id="drawerBox"><div class="paper" id="drawerPaper" style="text-align:left;font-family:Arial"></div></div>
<script>
function tick(){let d=new Date();let s=d.toLocaleDateString("en-ZA",{day:"2-digit",month:"short",year:"numeric"})+"<br>"+d.toLocaleTimeString("en-ZA");document.getElementById("topClock").innerHTML=s;let l=document.getElementById("loginClock");if(l)l.textContent=d.toLocaleString("en-ZA")}
tick();setInterval(tick,1000);
let pin="";function press(n){if(pin.length>=4)return;pin+=n;draw();if(pin.length==4){if(pin=="0000")document.getElementById("login").style.display="none";else{alert("Wrong");pin="";draw()}}}
function draw(){let s="";for(let i=0;i<4;i++)s+=i<pin.length?"* ":"_ ";document.getElementById("barbox").textContent=s;document.getElementById("fill").style.width=pin.length*25+"%";document.getElementById("count").textContent=pin.length+" / 4"}
document.addEventListener("keydown",e=>{if(document.getElementById("login").style.display!="none"&&/^[0-9]$/.test(e.key))press(+e.key);if(document.getElementById("login").style.display=="none"&&e.key=="Enter"&&document.getElementById("receipt").style.display!="flex")showReceipt()});
let labels=["1-4kg","4-5kg","5-6kg","6-7kg","7-8kg","8-9kg","9-10kg","10-11kg","11-12kg","13-15kg","15-20kg","20-25kg"];
let P=JSON.parse(localStorage.getItem("lr_brackets")||"null")||{fold:[120,130,150,160,180,200,220,250,260,270,350,420],iron:[200,210,230,240,260,280,300,330,340,350,450,550]};
function saveP(){localStorage.setItem("lr_brackets",JSON.stringify(P))}
let specialNames=["Iron Only","Blankets","Comforters","Takkies 5+ pairs","Dresses / Traditional","School Uniform","Blazer","Bundle 5kg WDF"];
let S=JSON.parse(localStorage.getItem("lr_specials")||"null")||[60,60,150,50,100,40,80,150];
function saveS(){localStorage.setItem("lr_specials",JSON.stringify(S))}
let daySales=JSON.parse(localStorage.getItem("lr_day_sales")||"[]");
function saveDay(){localStorage.setItem("lr_day_sales",JSON.stringify(daySales))}
let drawer=JSON.parse(localStorage.getItem("lr_drawer")||'{"in":0,"out":0}');
function saveDrawer(){localStorage.setItem("lr_drawer",JSON.stringify(drawer))}
let drawerPort=null;
async function kickDrawer(port){let w=port.writable.getWriter();await w.write(new Uint8Array([27,112,0,25,250,27,112,1,25,250]));w.releaseLock()}
async function autoOpenDrawer(){try{if(drawerPort&&drawerPort.readable){await kickDrawer(drawerPort);return true}if(navigator.serial){let ports=await navigator.serial.getPorts();for(let p of ports){try{if(!p.readable)await p.open({baudRate:9600});drawerPort=p;await kickDrawer(p);return true}catch(e){}}}return false}catch(e){return false}}
async function connectDrawerPrinter(){try{if(!navigator.serial)return alert("This browser cannot talk to the drawer. Use Chrome on laptop / PC with printer USB plugged in, then tap CONNECT again.");drawerPort=await navigator.serial.requestPort();await drawerPort.open({baudRate:9600});alert("Printer connected! Testing drawer now...");await kickDrawer(drawerPort)}catch(e){alert("Not connected. Plug printer USB in, allow it, try again.")}}
async function testDrawer(){let ok=await autoOpenDrawer();if(ok)alert("Drawer signal SENT. Did it pop open?");else alert("No printer connected yet. Tap CONNECT DRAWER PRINTER first, pick printer, then TEST again.")}
let printingDay=false;
function printDayEnd(){printingDay=true;window.print()}
window.addEventListener("afterprint",()=>{if(!printingDay)return;printingDay=false;daySales=[];saveDay();document.getElementById("dayend").style.display="none";alert("Day End printed. Totals cleared to R0 for next day.")});
let view="home";
let sale=[],paying=false,promoOn=false,orderNo="LR-"+Math.floor(10000+Math.random()*89999);
function totals(){let sub=0;sale.forEach(s=>sub+=s.price*s.qty);let disc=promoOn?Math.min(28,sub):0;return{sub:sub,disc:disc,total:sub-disc}}
function render(){
let left="";
if(view=="home"){left="<div class='grid'><button class='bigBtn' onclick='view=\"fold\";render()'><img class='cardImg' src='wash-fold.jpg' onerror=\"this.style.display='none'\" alt='Wash and Fold'>🧺<br>WASH &amp; FOLD<small>Tap to see kg prices</small></button><button class='bigBtn' onclick='view=\"iron\";render()'><img class='cardImg' src='wash-iron.jpg' onerror=\"this.style.display='none'\" alt='Wash and Iron'>♨️<br>WASH &amp; IRON<small>Tap to see kg prices</small></button><button class='bigBtn' style='grid-column:1 / -1;background:#0F6B5C' onclick='view=\"special\";render()'><img class='cardImg' src='special.jpg' onerror=\"this.style.display='none'\" alt='Special Services'>⭐<br>SPECIAL SERVICES<small>Iron Only • Blankets • Comforters • Takkies • Dresses • Uniform • Blazer • Bundle</small></button></div>"}
else if(view=="dress"){left="<h2>DRESSES / TRADITIONAL</h2><p style='font-weight:800'>Pick 1 price option, tap it, it adds straight</p><button onclick='view=\"special\";render()' style='background:#111;color:#fff'>← BACK TO SPECIALS</button><div class='grid' style='margin-top:10px'>"+[80,90,100,110,120].map(p=>`<button class='tile' style='font-size:28px' onclick='addDress(${p})'>R${p}<small>Dresses / Traditional</small></button>`).join("")+"</div>"}
else if(view=="special"){left="<h2>⭐ SPECIAL SERVICES</h2><p style='font-weight:800'>Tap a price, it adds straight</p><button onclick='view=\"home\";render()' style='background:#111;color:#fff'>← BACK TO 3 OPTIONS</button><div class='grid' style='margin-top:10px'>"+specialNames.map((nm,i)=>`<button class='tile' onclick='addSpecial(${i})'>${nm}<small>${i==4?"R80 - R120 - Tap for options":"R"+S[i]}</small></button>`).join("")+"</div>"}
else{let title=view=="fold"?"WASH & FOLD":"WASH & IRON";let arr=view=="fold"?P.fold:P.iron;left="<h2>"+title+"</h2><p style='font-weight:800'>Tap a kg price, it adds straight</p><button onclick='view=\"home\";render()' style='background:#111;color:#fff'>← BACK TO 3 OPTIONS</button><div class='grid' style='margin-top:10px'>"+labels.map((lab,i)=>`<button class='tile' onclick='addBracket(${i})'>${lab}<small>R${arr[i]}</small></button>`).join("")+"</div>"}
document.getElementById("left").innerHTML=left;
let t=totals();
let h=sale.map((s,i)=>`<div class='saleRow'><span><b>${s.name}</b><br><small>${s.qty} x R${s.price}</small></span><span>R${(s.price*s.qty).toFixed(2)}<br><button onclick='changeQty(${i},-1)'>-</button> <button onclick='changeQty(${i},1)'>+</button> <button onclick='removeSale(${i})' style='background:red;color:#fff'>✕</button></span></div>`).join("");
document.getElementById("right").innerHTML="<div class='card'><h2 style='text-align:center'>CURRENT ORDER</h2><p style='text-align:center;font-weight:800'>Order #"+orderNo+" - "+new Date().toLocaleString("en-ZA")+"</p>"+(sale.length?h:"<p>Select a service 👆</p>")+"<div class='totalRow'><span>Subtotal</span><span>R"+t.sub.toFixed(2)+"</span></div>"+(promoOn?`<div class='promoRow'><span>- Eco Promo</span><span>-R${t.disc.toFixed(2)}</span></div>`:"")+"<div class='totalRow' style='font-size:28px;color:#0F6B5C'><span>TOTAL</span><span>R"+t.total.toFixed(2)+"</span></div><select id='payMethod'><option>Cash</option><option>Card</option></select><button onclick='promoOn=!promoOn;render()' style='background:#e6f5f1;color:#0F6B5C'>"+(promoOn?"✓ Eco Promo ON - Tap to remove":"Apply Eco Promo - R28")+"</button><button class='charge' onclick='showReceipt()'>CHECKOUT & PAY</button><button class='holdBtn' onclick='holdSale()'>HOLD / PRINT RECEIPT</button><p style='text-align:center;font-weight:800'>Thank you - clean, fresh, care! ♻️ Eco-friendly</p><button onclick='sale=[];promoOn=false;render()'>Clear</button></div>"}
function addBracket(i){let title=view=="fold"?"Wash & Fold":"Wash & Iron";let price=view=="fold"?P.fold[i]:P.iron[i];let name=title+" "+labels[i];let f=sale.find(x=>x.name==name);if(f)f.qty+=1;else sale.push({name:name,price:price,qty:1,unit:"bag"});render()}
function addSpecial(i){if(i==4){view="dress";render();return}let price=S[i];let name=specialNames[i];let f=sale.find(x=>x.name==name&&x.price==price);if(f)f.qty+=1;else sale.push({name:name,price:price,qty:1,unit:"item"});render()}
function addDress(price){let name="Dresses / Traditional R"+price;let f=sale.find(x=>x.name==name&&x.price==price);if(f)f.qty+=1;else sale.push({name:name,price:price,qty:1,unit:"item"});render()}
function changeQty(i,d){sale[i].qty+=d;if(sale[i].qty<=0)sale.splice(i,1);render()}
function removeSale(i){sale.splice(i,1);render()}
function holdSale(){if(!sale.length)return alert("Nothing to hold");alert("Order "+orderNo+" HELD. Total R"+totals().total.toFixed(2));sale=[];promoOn=false;orderNo="LR-"+Math.floor(10000+Math.random()*89999);render()}
function showReceipt(){if(paying)return;if(!sale.length)return alert("Click item first");paying=true;let t=totals();
let method=document.getElementById("payMethod")?document.getElementById("payMethod").value:"Cash";
if(method=="Cash"){autoOpenDrawer()}
daySales.push({order:orderNo,total:t.total,method:method,time:new Date().toLocaleString("en-ZA")});saveDay();
let rows=sale.map(s=>`<div class="row"><span>${s.name} x${s.qty}</span><span>R${(s.price*s.qty).toFixed(2)}</span></div>`).join("");
document.getElementById("paper").innerHTML='<img src="logo.png" class="logoReceipt"><h2>THE LAUNDRY ROOM</h2>Clean • Fresh • Care<br>Order #'+orderNo+'<br>'+new Date().toLocaleString("en-ZA")+'<hr>'+rows+"<hr><div class='row'><span>Subtotal</span><span>R"+t.sub.toFixed(2)+"</span></div>"+(promoOn?`<div class='row'><span>Eco Promo</span><span>-R${t.disc.toFixed(2)}</span></div>`:"")+"<hr><div class='row'><b>TOTAL:</b><b>R"+t.total.toFixed(2)+"</b></div><div class='row'><span>Paid:</span><span>"+method+"</span></div><hr><b>THANK YOU!</b><br><div class='designer'>Designed by Musina POS Systems</div><br><button onclick='window.print()' style='background:#111;color:#fff'>PRINT</button><button onclick='closeReceipt()' style='background:#ccc'>New Sale</button>";
document.getElementById("receipt").style.display="flex"}
function closeReceipt(){document.getElementById("receipt").style.display="none";sale=[];paying=false;promoOn=false;orderNo="LR-"+Math.floor(10000+Math.random()*89999);render()}
function openMgmt(){let m=prompt("MANAGEMENT PASSWORD:","");if(m===null)return;if(m!="1234")return alert("Wrong management password");
let fInputs=labels.map((lab,i)=>`<label>${lab} Wash &amp; Fold R<input id='f${i}' type='number' value='${P.fold[i]}'></label>`).join("");
let iInputs=labels.map((lab,i)=>`<label>${lab} Wash &amp; Iron R<input id='r${i}' type='number' value='${P.iron[i]}'></label>`).join("");
let sInputs=specialNames.map((nm,i)=>`<label>${nm} R<input id='s${i}' type='number' value='${S[i]}'></label>`).join("");
document.getElementById("mgmtPaper").innerHTML="<h2>MANAGEMENT - CHANGE PRICES ONLY HERE</h2><p style='font-weight:800'>Staff cannot change prices. Only here, password 1234.</p>"+fInputs+"<hr>"+iInputs+"<hr><h2>SPECIAL SERVICES</h2>"+sInputs+"<button class='charge' onclick='saveMgmt()'>SAVE ALL PRICES</button><button onclick='document.getElementById(\"mgmt\").style.display=\"none\"'>Close</button>";
document.getElementById("mgmt").style.display="flex"}
function saveMgmt(){for(let i=0;i<12;i++){P.fold[i]=parseFloat(document.getElementById("f"+i).value)||P.fold[i];P.iron[i]=parseFloat(document.getElementById("r"+i).value)||P.iron[i]}for(let i=0;i<8;i++){S[i]=parseFloat(document.getElementById("s"+i).value)||S[i]}saveP();saveS();document.getElementById("mgmt").style.display="none";alert("Prices saved!");render()}
function openDrawer(){let m=prompt("CASH DRAWER PASSWORD:","");if(m===null)return;if(m!="1234")return alert("Wrong password - only management");
let cash=0,card=0;daySales.forEach(s=>{if(s.method=="Cash")cash+=s.total;else card+=s.total});
let expected=cash+drawer.in-drawer.out;
document.getElementById("drawerPaper").innerHTML="<div style='text-align:center'><img src='logo.png' class='logoReceipt'><h2>THE LAUNDRY ROOM</h2></div><h2 style='text-align:center'>💵 CASH DRAWER</h2><p style='font-weight:800;text-align:center'>"+new Date().toLocaleString("en-ZA")+"</p><p style='font-weight:800;text-align:center'>Printer: "+(drawerPort?"CONNECTED ✓":"NOT CONNECTED - tap CONNECT below")+"</p><hr><div class='row'><b>Cash Sales Today:</b><b>R"+cash.toFixed(2)+"</b></div><div class='row'><b>Card Sales Today:</b><b>R"+card.toFixed(2)+"</b></div><div class='row'><b>Cash IN (Float):</b><b>R"+drawer.in.toFixed(2)+"</b></div><div class='row'><b>Cash OUT:</b><b>R"+drawer.out.toFixed(2)+"</b></div><hr><div class='row' style='font-size:22px;color:#0F6B5C'><b>EXPECTED IN DRAWER:</b><b>R"+expected.toFixed(2)+"</b></div><hr><div class='designer'>Designed by Musina POS Systems</div><button onclick='connectDrawerPrinter()' style='background:#111;color:#fff'>CONNECT DRAWER PRINTER - 1 TIME ONLY</button><button onclick='testDrawer()' style='background:#1FA68F;color:#fff'>TEST DRAWER OPEN</button><button onclick='drawerOpen()' style='background:#111;color:#fff'>OPEN DRAWER</button><button onclick='drawerMove(\"in\")' style='background:#1FA68F;color:#fff'>+ CASH IN / FLOAT</button><button onclick='drawerMove(\"out\")' style='background:orange'>- CASH OUT / PAYOUT</button><button onclick='resetDrawer()' style='background:red;color:#fff'>RESET DRAWER TO R0</button><button onclick='document.getElementById(\"drawerBox\").style.display=\"none\"'>Close</button>";
document.getElementById("drawerBox").style.display="flex"}
function drawerOpen(){autoOpenDrawer();alert("CASH DRAWER OPENED - "+new Date().toLocaleTimeString("en-ZA"))}
function drawerMove(type){let a=prompt(type=="in"?"How much CASH IN? R":"How much CASH OUT? R","");if(a===null)return;a=parseFloat(a);if(!a||a<=0)return alert("Type a good amount");if(type=="in")drawer.in+=a;else drawer.out+=a;saveDrawer();document.getElementById("drawerBox").style.display="none";openDrawerNoPass()}
function openDrawerNoPass(){let cash=0,card=0;daySales.forEach(s=>{if(s.method=="Cash")cash+=s.total;else card+=s.total});let expected=cash+drawer.in-drawer.out;document.getElementById("drawerPaper").innerHTML="<div style='text-align:center'><img src='logo.png' class='logoReceipt'><h2>THE LAUNDRY ROOM</h2></div><h2 style='text-align:center'>💵 CASH DRAWER</h2><p style='font-weight:800;text-align:center'>Printer: "+(drawerPort?"CONNECTED ✓":"NOT CONNECTED")+"</p><hr><div class='row'><b>Cash Sales Today:</b><b>R"+cash.toFixed(2)+"</b></div><div class='row'><b>Card Sales Today:</b><b>R"+card.toFixed(2)+"</b></div><div class='row'><b>Cash IN (Float):</b><b>R"+drawer.in.toFixed(2)+"</b></div><div class='row'><b>Cash OUT:</b><b>R"+drawer.out.toFixed(2)+"</b></div><hr><div class='row' style='font-size:22px;color:#0F6B5C'><b>EXPECTED IN DRAWER:</b><b>R"+expected.toFixed(2)+"</b></div><hr><div class='designer'>Designed by Musina POS Systems</div><button onclick='connectDrawerPrinter()' style='background:#111;color:#fff'>CONNECT DRAWER PRINTER - 1 TIME ONLY</button><button onclick='testDrawer()' style='background:#1FA68F;color:#fff'>TEST DRAWER OPEN</button><button onclick='drawerOpen()' style='background:#111;color:#fff'>OPEN DRAWER</button><button onclick='drawerMove(\"in\")' style='background:#1FA68F;color:#fff'>+ CASH IN / FLOAT</button><button onclick='drawerMove(\"out\")' style='background:orange'>- CASH OUT / PAYOUT</button><button onclick='resetDrawer()' style='background:red;color:#fff'>RESET DRAWER TO R0</button><button onclick='document.getElementById(\"drawerBox\").style.display=\"none\"'>Close</button>";document.getElementById("drawerBox").style.display="flex"}
function resetDrawer(){if(!confirm("Reset drawer to R0? Cash IN and OUT will be 0."))return;drawer={in:0,out:0};saveDrawer();document.getElementById("drawerBox").style.display="none";openDrawerNoPass()}
function openDayEnd(){let m=prompt("DAY END PASSWORD:","");if(m===null)return;if(m!="1234")return alert("Wrong password - only management");
let cash=0,card=0;daySales.forEach(s=>{if(s.method=="Cash")cash+=s.total;else card+=s.total});
let rows=daySales.map(s=>`<div class='row'><span>${s.order} - ${s.method}</span><span>R${s.total.toFixed(2)}</span></div>`).join("")||"<p>No sales yet today.</p>";
document.getElementById("dayPaper").innerHTML="<div style='text-align:center'><img src='logo.png' class='logoReceipt'><h2>THE LAUNDRY ROOM</h2>Clean • Fresh • Care</div><h2 style='text-align:center'>🧾 DAY END</h2><p style='font-weight:800;text-align:center'>"+new Date().toLocaleDateString("en-ZA")+" - THE LAUNDRY ROOM</p><hr>"+rows+"<hr><div class='row'><b>Orders:</b><b>"+daySales.length+"</b></div><div class='row'><b>Cash Total:</b><b>R"+cash.toFixed(2)+"</b></div><div class='row'><b>Card Total:</b><b>R"+card.toFixed(2)+"</b></div><div class='row' style='font-size:20px'><b>GRAND TOTAL:</b><b>R"+(cash+card).toFixed(2)+"</b></div><div class='row'><b>Expected in Drawer:</b><b>R"+(cash+drawer.in-drawer.out).toFixed(2)+"</b></div><hr><div class='designer'>Designed by Musina POS Systems</div><p style='font-weight:800'>PRINT DAY END will print + clear to R0 for next day.</p><button onclick='printDayEnd()' style='background:#111;color:#fff'>PRINT DAY END + CLEAR FOR NEXT DAY</button><button onclick='closeDay()' style='background:red;color:#fff'>CLOSE DAY - RESET TO R0 WITHOUT PRINT</button><button onclick='document.getElementById(\"dayend\").style.display=\"none\"'>Close - Keep Totals</button>";
document.getElementById("dayend").style.display="flex"}
function closeDay(){if(!confirm("Close day? This will reset all totals to R0. Are you sure?"))return;daySales=[];saveDay();drawer={in:0,out:0};saveDrawer();document.getElementById("dayend").style.display="none";alert("Day closed. Totals reset to R0 for tomorrow.")}
render();
</script></body></html>
