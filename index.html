<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Laundry Room</title>
<style>body{font-family:Arial;margin:0;background:#f4f8f7}button{padding:14px;font-weight:900;width:100%;margin-top:6px;border:3px solid #0F6B5C;border-radius:10px;cursor:pointer}.top{background:#1FA68F;color:#fff;padding:12px;text-align:center;font-weight:900;font-size:24px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px}.tile{background:#1FA68F;color:#fff;min-height:100px;font-size:17px}.card{background:#fff;margin:12px;padding:14px;border:3px solid #0F6B5C;border-radius:10px}.on{background:#1FA68F!important;color:#fff!important}#mgmt{position:fixed;inset:0;background:#fff;display:none;overflow:auto;padding:12px}input{width:100%;padding:10px;margin:4px 0;border:2px solid #000}</style></head><body>
<div id="login" style="position:fixed;inset:0;background:#1FA68F;color:#fff;text-align:center;padding-top:80px;z-index:9"><h1>THE LAUNDRY ROOM 🇿🇦</h1><p>Type PIN</p><h1 id="pinShow">_ _ _ _</h1><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;max-width:300px;margin:auto"><button onclick="p(1)">1</button><button onclick="p(2)">2</button><button onclick="p(3)">3</button><button onclick="p(4)">4</button><button onclick="p(5)">5</button><button onclick="p(6)">6</button><button onclick="p(7)">7</button><button onclick="p(8)">8</button><button onclick="p(9)">9</button><button onclick="pin='';d()">C</button><button onclick="p(0)">0</button><button onclick="pin=pin.slice(0,-1);d()">X</button></div></div>
<div class="top">THE LAUNDRY ROOM 🇿🇦<br><small id="clock"></small></div>
<div class="grid" id="tiles"></div>
<div class="card"><h3>CURRENT ORDER</h3><div id="order"></div><h2 id="total">TOTAL R0</h2><button onclick="pay='Cash';render()" id="bCash">💵 CASH</button><button onclick="pay='Card';render()" id="bCard">💳 CARD</button><button onclick="checkout()" style="background:#1FA68F;color:#fff">CHECKOUT & PRINT</button><button onclick="openMgmt()" style="background:#000;color:#fff">🔒 MANAGEMENT - CHANGE PRICES HERE</button><button onclick="sale=[];render()">Clear</button></div>
<div id="mgmt"></div>
<script>
let pin="";function p(n){if(pin.length>=4)return;pin+=n;d();if(pin.length==4){if(pin=="0000"){document.getElementById("login").style.display="none"}else{alert("Wrong PIN");pin="";d()}}}
function d(){let s="";for(let i=0;i<4;i++)s+=i<pin.length?"_ ":"_ ";document.getElementById("pinShow").textContent=s}
setInterval(()=>{document.getElementById("clock").textContent=new Date().toLocaleString("en-ZA")},1000);
let D={b:[[4,120,200],[5,130,210],[6,150,230],[7,160,240],[8,180,260],[9,200,280],[10,220,300],[11,250,330],[12,260,340],[15,270,350],[20,350,450],[25,420,550]],tak:80,alt:60,res:450,com:850};
let P=JSON.parse(localStorage.getItem("P")||"null")||D;
let sale=[],pay="Cash",sales=JSON.parse(localStorage.getItem("S")||"[]");
function items(){return[{n:"Wash & Fold",t:"f"},{n:"Wash & Iron",t:"i"},{n:"Takkie Wash R"+P.tak,pr:P.tak},{n:"Alterations R"+P.alt,pr:P.alt},{n:"Residential R"+P.res,pr:P.res},{n:"Commercial R"+P.com,pr:P.com}]}
function render(){document.getElementById("tiles").innerHTML=items().map((x,i)=>`<button class=tile onclick="add(${i})">${x.n}</button>`).join("");
let tot=0;sale.forEach(s=>tot+=s.pr_s.q);
http://document.getElementById("order").innerHTML=sale.map((s,i)=>`${s.n} x${s.q} = R${s.pr_s.q} <button style="width:auto;padding:4px" onclick="sale.splice(${i},1);render()">X</button><br>`).join("")||"Tap a green tile";
http://document.getElementById("total").textContent="TOTAL R"+tot+" - "+pay;
http://document.getElementById("bCash").className=pay=="Cash"?"on":"";document.getElementById("bCard").className=pay=="Card"?"on":"";}
function add(i){let x=items()[i];
if(x.t){let kg=prompt("Enter KG:","9");if(!kg)return;kg=+kg;let b=P.b.find(b=>kg<=b[0]);if(!b)return alert("Over 25kg");let pr=x.t=="f"?b[1]:b[2];if(!confirm(kg+"kg = R"+pr+" OK?"))return;sale.push({n:x.n+" "+kg+"kg",pr:pr,q:1});}
else{let q=prompt("How many?","1");if(!q)return;sale.push({n:x.n,pr:x.pr,q:+q});}render()}
function checkout(){if(!sale.length)return alert("No sale");let tot=0;sale.forEach(s=>tot+=s.pr_s.q);sales.push({d:new Date().toLocaleString("en-ZA"),t:tot,m:pay,items:sale.map(s=>s.n+" x"+s.q).join(", ")});localStorage.setItem("S",JSON.stringify(sales));alert("PAID R"+tot+" "+pay+" THE LAUNDRY ROOM THANK YOU "+sale.map(s=>s.n+" x"+s.q+" R"+s.pr*s.q).join(" "));sale=[];render()}
function openMgmt(){let m=prompt("Manager password:");if(m!="1234")return alert("Wrong");
let h="<h2>MANAGEMENT - CHANGE PRICES ONLY HERE</h2>";P.b.forEach((b,i)=>{h+=`Up to ${b[0]}kg: Fold R<input id=f${i} value=${b[1]}> Iron R<input id=i${i} value=${b[2]}><br>`});
h+=`Takkie R<input id=tak value=${P.tak}> Alter R<input id=alt value=${P.alt}> Res R<input id=res value=${P.res}> Com R<input id=com value=${P.com}><br><button onclick="saveP()">SAVE PRICES</button><button onclick="document.getElementById('mgmt').style.display='none'">Close</button><h3>TODAY SALES</h3>`+sales.map(s=>s.d+" R"+s.t+" "+s.m+" "+s.items).join("<br>")+`<br><b>TOTAL R${sales.reduce((a,s)=>a+s.t,0)}</b><br><button onclick="if(confirm('Clear all?')){sales=[];localStorage.setItem('S','[]');openMgmt()}">Clear History</button>`;
http://document.getElementById("mgmt").innerHTML=h;document.getElementById("mgmt").style.display="block";}
function saveP(){P.b.forEach((b,i)=>{b[1]=+document.getElementById("f"+i).value;b[2]=+document.getElementById("i"+i).value});P.tak=+document.getElementById("tak").value;P.alt=+document.getElementById("alt").value;P.res=+document.getElementById("res").value;P.com=+document.getElementById("com").value;localStorage.setItem("P",JSON.stringify(P));alert("Prices saved");document.getElementById("mgmt").style.display="none";render()}
render();
</script></body></html>
